<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BGM Shuffle — Minecraft BGM プレイヤー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px;
  --text-xs: .75rem; --text-sm: .875rem; --text-md: 1rem; --text-lg: 1.2rem;
  --ease-out: cubic-bezier(.16, 1, .3, 1); --dur: 140ms;
  --color-paper: oklch(97.8% .013 95); --color-paper-2: oklch(95% .018 95); --color-paper-3: oklch(91.5% .022 90);
  --color-ink: oklch(24% .035 145); --color-ink-2: oklch(40% .035 140); --color-muted: oklch(48% .028 120); --color-rule: oklch(87.5% .024 98);
  --color-accent: oklch(52% .14 145); --color-accent-ink: oklch(98% .01 100); --color-accent-soft: oklch(93.5% .055 140); --color-focus: oklch(50% .14 145);
  --color-error: oklch(52% .19 27); --color-error-soft: oklch(96% .03 27);
  --stage: oklch(21% .04 150); --stage-2: oklch(27% .05 150); --stage-ink: oklch(96% .02 110); --stage-muted: oklch(72% .04 130);
  --grass: oklch(74% .19 145); --dirt: oklch(56% .09 62);
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius-card: 20px; --radius-ctl: 10px; --bar-h: 52px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body {
  font-family: var(--font-body); color: var(--color-ink); background: var(--color-paper); -webkit-font-smoothing: antialiased; line-height: 1.6;
  background-image: linear-gradient(var(--color-paper-2) 1px, transparent 1px), linear-gradient(90deg, var(--color-paper-2) 1px, transparent 1px);
  background-size: 32px 32px; background-position: -1px -1px;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font: inherit; color: inherit; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--grass); outline-offset: 2px; }
.hidden { display: none !important; }

.bar { position: sticky; top: 0; z-index: 5; height: var(--bar-h); display: flex; align-items: center; gap: var(--space-sm); padding: 0 var(--space-md);
  background: color-mix(in oklab, var(--color-paper) 80%, transparent); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border-bottom: 1px solid var(--color-rule); }
.brand { display: flex; align-items: center; gap: var(--space-xs); font-weight: 900; letter-spacing: -.01em; }
.brand .logo { width: 28px; height: 28px; border-radius: 6px; background: var(--color-accent); color: var(--color-accent-ink); display: grid; place-items: center; box-shadow: inset 0 -6px 0 oklch(40% .12 145); }
.brand .logo svg { width: 16px; height: 16px; }
.bar .sp { flex: 1; }
.count { font-size: var(--text-xs); color: var(--color-muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: 40px; padding: 0 var(--space-md); border: 1px solid var(--color-rule); background: var(--color-paper); border-radius: var(--radius-ctl); cursor: pointer; font-weight: 500;
  transition: background var(--dur) var(--ease-out), transform var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out); }
.btn:hover { background: var(--color-paper-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--color-accent); color: var(--color-accent-ink); border-color: transparent; }
.btn.primary:hover { background: oklch(46% .14 145); }
.btn.icon { width: 48px; padding: 0; }

main { max-width: 1120px; margin: 0 auto; padding: var(--space-lg) var(--space-md) var(--space-xl); }

/* empty */
.drop { display: grid; justify-items: center; gap: var(--space-md); text-align: center; padding: var(--space-xl) var(--space-lg); margin-top: var(--space-lg); border: 1.5px dashed var(--color-rule); border-radius: var(--radius-card); background: color-mix(in oklab, var(--color-paper-2) 88%, transparent); transition: border-color var(--dur), background var(--dur); max-width: 720px; margin-inline: auto; }
.drop .mark { width: 56px; height: 56px; border-radius: 12px; background: var(--color-accent-soft); color: var(--color-accent); display: grid; place-items: center; }
.drop .mark svg { width: 28px; height: 28px; }
.drop h1 { margin: 0; font-size: clamp(1.5rem, 5.5vw, 2.1rem); letter-spacing: -.02em; line-height: 1.25; }
.drop p { margin: 0; color: var(--color-muted); font-size: var(--text-sm); }
.drop .btn { min-height: 48px; padding: 0 var(--space-lg); font-size: var(--text-md); box-shadow: 0 3px 0 oklch(38% .12 145); }
.drop .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 oklch(38% .12 145); }
.err { padding: var(--space-sm) var(--space-md); border-radius: var(--radius-ctl); background: var(--color-error-soft); color: var(--color-error); font-size: var(--text-sm); }

/* layout */
.grid { display: grid; gap: var(--space-lg); grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }

/* stage */
.stage { position: relative; display: flex; flex-direction: column; min-height: 560px; padding: var(--space-lg); border-radius: 28px; color: var(--stage-ink); overflow: hidden;
  background: radial-gradient(120% 80% at 20% 0%, var(--stage-2), var(--stage)); box-shadow: 0 8px 0 oklch(15% .035 150); }
.stage-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); font-size: var(--text-xs); letter-spacing: .08em; font-weight: 700; }
.live { display: flex; align-items: center; gap: var(--space-xs); color: var(--grass); }
.live .dot { width: 8px; height: 8px; background: var(--grass); }
.playing .live .dot { animation: pulse 1.2s steps(2) infinite; }
@keyframes pulse { 50% { opacity: .15; } }
.fxtag { font-family: var(--font-data); padding: 3px 10px; border-radius: 6px; background: oklch(100% 0 0 / .08); color: var(--stage-muted); transition: background var(--dur), color var(--dur); }
.fxtag.on { background: var(--grass); color: var(--stage); }
canvas#vis { display: block; flex: 1; width: 100%; min-height: 200px; margin: var(--space-md) 0; }
.title { margin: 0; font-size: clamp(2rem, 6.2vw, 4rem); font-weight: 900; letter-spacing: -.04em; line-height: 1.02; overflow-wrap: anywhere; }
.sub { margin-top: var(--space-xs); color: var(--stage-muted); font-size: var(--text-sm); font-family: var(--font-data); overflow-wrap: anywhere; }
.seek { margin-top: var(--space-lg); display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-sm); align-items: center; font-size: var(--text-xs); color: var(--stage-muted); }
.ctrl { display: flex; align-items: center; gap: var(--space-sm); margin-top: var(--space-sm); }
.ctrl .sp { flex: 1; }
.stage .btn { background: oklch(100% 0 0 / .08); border-color: transparent; color: var(--stage-ink); }
.stage .btn:hover { background: oklch(100% 0 0 / .16); }
.stage .btn.play { width: 76px; height: 76px; border-radius: 22px; padding: 0; background: var(--grass); color: var(--stage); box-shadow: 0 5px 0 oklch(48% .15 145); }
.stage .btn.play:hover { background: oklch(78% .19 145); }
.stage .btn.play:active { transform: translateY(4px); box-shadow: 0 1px 0 oklch(48% .15 145); }
.stage .btn.play svg { width: 32px; height: 32px; fill: currentColor; }
.vol { display: flex; align-items: center; gap: var(--space-xs); width: 120px; color: var(--stage-muted); }
.vol input { width: 100%; }
@media (max-width: 480px) { .vol { display: none; } .stage { min-height: 520px; padding: var(--space-md); } }

/* range */
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; cursor: pointer; margin: 0; --p: 0%; --on: var(--color-accent); --off: var(--color-paper-3); }
.stage input[type=range] { --on: var(--grass); --off: oklch(100% 0 0 / .16); }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--on) var(--p), var(--off) var(--p)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--off); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--on); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 20px; margin-top: -7px; border-radius: 4px; background: var(--color-paper); border: 2px solid var(--on); }
input[type=range]::-moz-range-thumb { width: 12px; height: 16px; border-radius: 4px; background: var(--color-paper); border: 2px solid var(--on); }

/* side */
.side { display: grid; gap: var(--space-lg); }
.panel { border: 1px solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-paper); padding: var(--space-md); box-shadow: 0 6px 0 var(--color-paper-3); }
.ph { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); margin-bottom: var(--space-md); }
.ph h2 { margin: 0; display: flex; align-items: center; gap: var(--space-xs); font-size: var(--text-sm); font-weight: 900; letter-spacing: .08em; }
.ph .btn { min-height: 32px; padding: 0 var(--space-sm); font-size: var(--text-xs); }
.ph .btn svg { width: 14px; height: 14px; }
.pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-xs); }
@media (max-width: 480px) { .pads { grid-template-columns: repeat(3, 1fr); } }
.pad { position: relative; display: grid; justify-items: center; gap: 6px; padding: var(--space-sm) 4px; border: 1px solid var(--color-rule); border-radius: 14px; background: var(--color-paper-2); cursor: pointer; font-size: var(--text-xs); font-weight: 700;
  box-shadow: 0 3px 0 var(--color-paper-3); transition: transform var(--dur) var(--ease-out), background var(--dur), box-shadow var(--dur), color var(--dur); }
.pad svg { width: 22px; height: 22px; }
.pad:hover { background: var(--color-accent-soft); }
.pad:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--color-paper-3); }
.pad[aria-pressed=true] { background: var(--color-accent); color: var(--color-accent-ink); border-color: transparent; box-shadow: 0 3px 0 oklch(38% .12 145); }
.pad kbd { position: absolute; top: 4px; right: 6px; font-family: var(--font-data); font-size: 10px; opacity: .45; }
.rows { display: grid; gap: var(--space-2xs); margin-top: var(--space-md); }
.row { display: grid; grid-template-columns: 5.6em 1fr 4.6em; gap: var(--space-sm); align-items: center; font-size: var(--text-sm); }
.row label { font-weight: 700; }
.row output { text-align: right; font-size: var(--text-xs); color: var(--color-ink-2); }
.link { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-sm); padding-top: var(--space-sm); border-top: 1px solid var(--color-rule); font-size: var(--text-sm); }
.tgl { position: relative; width: 44px; height: 26px; border-radius: 8px; border: 0; background: var(--color-paper-3); cursor: pointer; transition: background var(--dur); }
.tgl::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 5px; background: var(--color-paper); box-shadow: 0 1px 2px oklch(0% 0 0 / .25); transition: transform var(--dur) var(--ease-out); }
.tgl[aria-checked=true] { background: var(--color-accent); }
.tgl[aria-checked=true]::after { transform: translateX(18px); }

ol.q { list-style: none; margin: 0; padding: 0; }
ol.q li { border-top: 1px solid var(--color-rule); }
ol.q li:first-child { border: 0; }
ol.q button { width: 100%; display: flex; gap: var(--space-sm); align-items: center; text-align: left; padding: var(--space-xs) var(--space-xs); min-height: 44px; background: transparent; border: 0; border-radius: 8px; cursor: pointer; transition: background var(--dur); }
ol.q button:hover { background: var(--color-paper-2); }
ol.q .n { width: 1.6em; color: var(--color-muted); font-size: var(--text-xs); text-align: right; }
ol.q .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-sm); }
ol.q .f { color: var(--color-muted); font-size: var(--text-xs); }
.kbd { margin-top: var(--space-md); color: var(--color-muted); font-size: var(--text-xs); display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-md); }
.kbd kbd { font-family: var(--font-data); background: var(--color-paper-2); border: 1px solid var(--color-rule); border-radius: 4px; padding: 0 5px; }
.page-drop { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: color-mix(in oklab, var(--color-accent-soft) 85%, transparent); color: var(--color-accent); font-weight: 900; font-size: var(--text-lg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.page-drop.on { display: grid; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></symbol>

  <symbol id="i-sliders" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></symbol>

</svg>

<header class="bar">
  <div class="brand"><span class="logo"><svg class="i"><use href="#i-music"/></svg></span>BGM Shuffle</div>
  <div class="sp"></div>
  <span class="count num hidden" id="count"></span>
  <button class="btn" id="openBtn"><svg class="i"><use href="#i-folder"/></svg><span>フォルダ</span></button>
</header>

<main>
  <section class="drop" id="drop">
    <span class="mark"><svg class="i"><use href="#i-folder"/></svg></span>
    <h1>フォルダを選ぶだけで、<br>すぐランダム再生。</h1>
    <p>抽出したMinecraftのBGMフォルダを選択、またはここにドロップ。サブフォルダも自動で読み込みます。</p>
    <button class="btn primary" id="openBtn2"><svg class="i"><use href="#i-folder"/></svg>フォルダを読み込む</button>
    <div class="err hidden" id="err" role="alert"></div>
  </section>

  <div class="grid hidden" id="player">
    <section class="stage" id="stage">
      <div class="stage-top">
        <span class="live"><span class="dot"></span><span id="state">NOW PLAYING</span></span>
        <span class="fxtag" id="fxtag">FX OFF</span>
      </div>
      <canvas id="vis" aria-hidden="true"></canvas>
      <h1 class="title" id="title">—</h1>
      <div class="sub" id="sub">—</div>
      <div class="seek">
        <span class="num" id="cur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="再生位置">
        <span class="num" id="dur">0:00</span>
      </div>
      <div class="ctrl">
        <div class="vol"><svg class="i"><use href="#i-vol"/></svg><input type="range" id="vol" min="0" max="100" value="70" aria-label="音量"></div>
        <span class="sp"></span>
        <button class="btn icon" id="prev" aria-label="前の曲"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="btn play" id="play" aria-label="再生/一時停止"><svg class="i"><use href="#i-play"/></svg></button>
        <button class="btn icon" id="next" aria-label="次の曲"><svg class="i"><use href="#i-next"/></svg></button>
        <span class="sp"></span>
        <button class="btn icon" id="reshuffle" aria-label="シャッフルし直す" title="シャッフルし直す"><svg class="i"><use href="#i-shuffle"/></svg></button>
      </div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="ph"><h2><svg class="i"><use href="#i-sliders"/></svg>EFFECTS</h2><button class="btn" id="fxReset"><svg class="i"><use href="#i-reset"/></svg>リセット</button></div>
        <div class="pads" id="pads"></div>
        <div class="rows" id="rows"></div>
        <div class="link"><span>速度に合わせてピッチも変える</span><button class="tgl" id="link" role="switch" aria-checked="true" aria-label="ピッチ連動"></button></div>
      </section>
      <section class="panel">
        <div class="ph"><h2>NEXT UP</h2><span class="num count" id="qinfo"></span></div>
        <ol class="q" id="queue"></ol>
        <div class="kbd">
          <span><kbd>Space</kbd> 再生/停止</span><span><kbd>←</kbd><kbd>→</kbd> 曲送り</span><span><kbd>↑</kbd><kbd>↓</kbd> 音量</span><span><kbd>0</kbd>–<kbd>6</kbd> エフェクト</span>
        </div>
      </section>
    </aside>
  </div>
</main>

<div class="page-drop" id="pageDrop">ここにフォルダをドロップ</div>
<input type="file" id="picker" webkitdirectory directory multiple class="hidden">
<audio id="audio" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio'), picker = $('picker');
  const EXT = /\.(ogg|oga|mp3|wav|m4a|aac|flac|opus|webm)$/i;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const anim = (t, v) => { if (window.gsap && !reduce) gsap.from(t, v); };

  let tracks = [], order = [], pos = -1, url = null;

  /* ================= 読み込み ================= */
  $('openBtn').onclick = $('openBtn2').onclick = () => picker.click();
  picker.onchange = () => { load([...picker.files].map(f => ({ file: f, path: f.webkitRelativePath || f.name }))); picker.value = ''; };

  async function walk(entry, base, out) {
    if (entry.isFile) await new Promise(r => entry.file(f => { out.push({ file: f, path: base + f.name }); r(); }, r));
    else if (entry.isDirectory) {
      const rd = entry.createReader(); let batch;
      do { batch = await new Promise(r => rd.readEntries(r, () => r([]))); for (const e of batch) await walk(e, base + entry.name + '/', out); } while (batch.length);
    }
  }
  let depth = 0;
  addEventListener('dragenter', e => { e.preventDefault(); depth++; $('pageDrop').classList.add('on'); });
  addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) $('pageDrop').classList.remove('on'); });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', async e => {
    e.preventDefault(); depth = 0; $('pageDrop').classList.remove('on');
    const items = [...(e.dataTransfer.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    const out = [];
    if (items.length) for (const it of items) await walk(it, '', out);
    else [...e.dataTransfer.files].forEach(f => out.push({ file: f, path: f.name }));
    load(out);
  });

  function load(list) {
    const audios = list.filter(x => EXT.test(x.file.name));
    if (!audios.length) {
      $('err').textContent = '音声ファイル(.ogg / .mp3 / .wav など)が見つかりませんでした。別のフォルダを選んでください。';
      $('err').classList.remove('hidden'); return;
    }
    $('err').classList.add('hidden');
    tracks = audios.map(x => {
      const parts = x.path.split('/'); const name = parts.pop().replace(EXT, '');
      return { file: x.file, title: name.replace(/_+/g, ' ').trim(), folder: parts.length > 1 ? parts.slice(1).join('/') : (parts[0] || ''), key: x.path };
    }).sort((a, b) => a.key.localeCompare(b.key, 'ja', { numeric: true }));
    $('drop').classList.add('hidden'); $('player').classList.remove('hidden');
    $('count').textContent = tracks.length + ' tracks'; $('count').classList.remove('hidden');
    anim('#stage', { y: 24, opacity: 0, duration: .7, ease: 'expo.out' });
    anim('.side .panel', { y: 24, opacity: 0, duration: .7, ease: 'expo.out', stagger: .08, delay: .1 });
    shuffle(true); go(0);
  }

  /* ================= キュー ================= */
  function shuffle(initial) {
    const last = order[pos]; const a = tracks.map((_, i) => i);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    if (!initial && a.length > 1 && a[0] === last) [a[0], a[1]] = [a[1], a[0]];
    order = a; pos = -1;
  }
  function go(p) {
    if (!tracks.length) return;
    if (p >= order.length) { shuffle(false); p = 0; }
    if (p < 0) p = 0;
    pos = p; const t = tracks[order[pos]];
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(t.file); audio.src = url; applyFx(); audio.play().catch(() => {});
    $('title').textContent = t.title; $('sub').textContent = t.folder ? t.folder + ' / ' + t.file.name : t.file.name;
    document.title = t.title + ' — BGM Shuffle';
    anim('.title, .sub', { y: 14, opacity: 0, duration: .55, ease: 'expo.out', stagger: .06 });
    renderQueue();
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: 'Minecraft', album: t.folder || 'BGM' });
  }
  function renderQueue() {
    const ul = $('queue'); ul.textContent = '';
    for (let i = pos + 1; i < Math.min(order.length, pos + 7); i++) {
      const t = tracks[order[i]], li = document.createElement('li'), b = document.createElement('button');
      b.innerHTML = '<span class="n num"></span><span class="t"></span><span class="f"></span>';
      b.children[0].textContent = i - pos; b.children[1].textContent = t.title; b.children[2].textContent = t.folder;
      b.onclick = () => go(i); li.appendChild(b); ul.appendChild(li);
    }
    if (!ul.children.length) { const li = document.createElement('li'); li.innerHTML = '<button disabled><span class="t">このあと自動で再シャッフル</span></button>'; ul.appendChild(li); }
    $('qinfo').textContent = `${pos + 1} / ${order.length}`;
  }

  /* ================= 再生制御 ================= */
  const setIcon = on => { $('play').querySelector('use').setAttribute('href', on ? '#i-pause' : '#i-play'); $('stage').classList.toggle('playing', on); $('state').textContent = on ? 'NOW PLAYING' : 'PAUSED'; };
  const toggle = () => { if (tracks.length) audio.paused ? audio.play() : audio.pause(); };
  $('play').onclick = toggle;
  $('next').onclick = () => go(pos + 1);
  $('prev').onclick = () => (audio.currentTime > 3 || pos <= 0) ? (audio.currentTime = 0) : go(pos - 1);
  $('reshuffle').onclick = () => { shuffle(false); go(0); anim('#reshuffle svg', { rotate: -180, duration: .5, ease: 'expo.out' }); };
  audio.addEventListener('play', () => { setIcon(true); initAudio(); });
  audio.addEventListener('pause', () => setIcon(false));
  audio.addEventListener('ended', () => go(pos + 1));
  audio.addEventListener('error', () => { if (tracks.length > 1) go(pos + 1); });

  const fmt = s => { if (!isFinite(s)) return '0:00'; s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const fill = el => el.style.setProperty('--p', (el.value - el.min) / (el.max - el.min) * 100 + '%');
  const seek = $('seek'), vol = $('vol'); let dragging = false;
  seek.oninput = () => { dragging = true; fill(seek); $('cur').textContent = fmt(seek.value / 1000 * audio.duration); };
  seek.onchange = () => { audio.currentTime = seek.value / 1000 * audio.duration; dragging = false; };
  audio.addEventListener('timeupdate', () => {
    $('dur').textContent = fmt(audio.duration); if (dragging) return;
    $('cur').textContent = fmt(audio.currentTime); seek.value = audio.duration ? audio.currentTime / audio.duration * 1000 : 0; fill(seek);
  });
  let v0 = 70; try { v0 = +localStorage.getItem('bgm.vol') || 70; } catch (e) {}
  vol.value = v0; audio.volume = v0 / 100; fill(vol);
  vol.oninput = () => { audio.volume = vol.value / 100; fill(vol); try { localStorage.setItem('bgm.vol', vol.value); } catch (e) {} };

  /* ================= エフェクト ================= */
  const lpFreq = v => v >= 100 ? 20000 : 200 * Math.pow(100, v / 100);
  const SL = [
    { k: 'reverb', l: 'リバーブ', min: 0, max: 100, f: v => v + '%' },
    { k: 'echo', l: 'エコー', min: 0, max: 100, f: v => v + '%' },
    { k: 'lp', l: 'ローパス', min: 0, max: 100, f: v => v >= 100 ? 'OFF' : Math.round(lpFreq(v)) + 'Hz' },
    { k: 'bass', l: '低音', min: -6, max: 12, f: v => (v > 0 ? '+' : '') + v + 'dB' },
    { k: 'speed', l: '速度', min: 50, max: 150, f: v => (v / 100).toFixed(2) + '×' },
  ];
  const BASE = { reverb: 0, echo: 0, lp: 100, bass: 0, speed: 100, hp: 0 };
  const PRESETS = [
    { n: 'OFF', i: 'power', v: {} },
    { n: '水中', i: 'waves', v: { lp: 24, reverb: 30, bass: 4, speed: 96 } },
    { n: '洞窟', i: 'mountain', v: { reverb: 78, echo: 22, lp: 92 } },
    { n: 'ネザー', i: 'flame', v: { speed: 80, reverb: 55, bass: 8, lp: 55, echo: 10 } },
    { n: 'ラジオ', i: 'radio', v: { lp: 62, hp: 420, bass: -4 } },
    { n: '夜更け', i: 'moon', v: { speed: 90, reverb: 60, lp: 68, bass: 3, echo: 20 } },
    { n: 'やまびこ', i: 'echo', v: { echo: 72, reverb: 20 } },
  ];
  const fx = { ...BASE }; let link = true, active = 0;

  const pads = $('pads'), rows = $('rows');
  PRESETS.forEach((p, idx) => {
    const b = document.createElement('button'); b.className = 'pad'; b.setAttribute('aria-pressed', idx === 0);
    b.innerHTML = `<kbd>${idx}</kbd><svg class="i"><use href="#i-${p.i}"/></svg><span>${p.n}</span>`;
    b.onclick = () => { setPreset(idx); anim(b, { scale: .88, duration: .5, ease: 'elastic.out(1,.5)' }); };
    pads.appendChild(b);
  });
  SL.forEach(s => {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = `<label for="fx-${s.k}">${s.l}</label><input type="range" id="fx-${s.k}" min="${s.min}" max="${s.max}" step="1"><output class="num" id="o-${s.k}"></output>`;
    rows.appendChild(r);
    r.querySelector('input').oninput = e => { fx[s.k] = +e.target.value; fx.hp = fx.hp; mark(-1); applyFx(); sync(); };
  });
  function sync() {
    SL.forEach(s => { const el = $('fx-' + s.k); el.value = fx[s.k]; fill(el); $('o-' + s.k).textContent = s.f(fx[s.k]); });
    const off = SL.every(s => fx[s.k] === BASE[s.k]) && !fx.hp;
    const tag = $('fxtag'); tag.classList.toggle('on', !off);
    tag.textContent = off ? 'FX OFF' : 'FX · ' + (active >= 0 ? PRESETS[active].n : 'CUSTOM');
  }
  function mark(i) { active = i; [...pads.children].forEach((b, k) => b.setAttribute('aria-pressed', k === i)); }
  function setPreset(i) { Object.assign(fx, BASE, PRESETS[i].v); mark(i); applyFx(); sync(); }
  $('fxReset').onclick = () => { setPreset(0); link = true; $('link').setAttribute('aria-checked', true); applyFx(); };
  $('link').onclick = () => { link = !link; $('link').setAttribute('aria-checked', link); applyFx(); };

  let actx, N, analyser, data;
  function impulse(sec, decay) {
    const sr = actx.sampleRate, len = sr * sec, buf = actx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return buf;
  }
  function initAudio() {
    if (actx) { actx.resume(); return; }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const g = () => actx.createGain(), f = (t) => { const n = actx.createBiquadFilter(); n.type = t; return n; };
      const src = actx.createMediaElementSource(audio);
      N = { hp: f('highpass'), bass: f('lowshelf'), lp: f('lowpass'), mix: g(), dry: g(), conv: actx.createConvolver(), rev: g(), dly: actx.createDelay(2), fb: g(), echo: g(), out: g() };
      N.bass.frequency.value = 180; N.conv.buffer = impulse(3.2, 2.6); N.dly.delayTime.value = .38;
      src.connect(N.hp); N.hp.connect(N.bass); N.bass.connect(N.lp); N.lp.connect(N.mix);
      N.mix.connect(N.dry); N.dry.connect(N.out);
      N.mix.connect(N.conv); N.conv.connect(N.rev); N.rev.connect(N.out);
      N.mix.connect(N.dly); N.dly.connect(N.fb); N.fb.connect(N.dly); N.dly.connect(N.echo); N.echo.connect(N.out);
      analyser = actx.createAnalyser(); analyser.fftSize = 128; analyser.smoothingTimeConstant = .8;
      N.out.connect(analyser); analyser.connect(actx.destination);
      data = new Uint8Array(analyser.frequencyBinCount);
      applyFx(); draw();
    } catch (e) { actx = null; N = null; }
  }
  function applyFx() {
    audio.defaultPlaybackRate = audio.playbackRate = fx.speed / 100;
    audio.preservesPitch = audio.mozPreservesPitch = audio.webkitPreservesPitch = !link;
    if (!N) return;
    const t = actx.currentTime, set = (p, v) => p.setTargetAtTime(v, t, .06);
    set(N.hp.frequency, fx.hp || 10); set(N.bass.gain, fx.bass); set(N.lp.frequency, lpFreq(fx.lp));
    set(N.rev.gain, fx.reverb / 100 * 1.5); set(N.dry.gain, 1 - fx.reverb / 100 * .35);
    set(N.echo.gain, fx.echo / 100 * .8); set(N.fb.gain, .22 + fx.echo / 100 * .38);
  }
  sync();

  addEventListener('keydown', e => {
    if (!tracks.length || (e.target.tagName === 'INPUT' && e.target.type !== 'range')) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowRight') $('next').click();
    else if (e.code === 'ArrowLeft') $('prev').click();
    else if (e.code === 'ArrowUp' && e.target !== vol) { e.preventDefault(); vol.value = Math.min(100, +vol.value + 5); vol.oninput(); }
    else if (e.code === 'ArrowDown' && e.target !== vol) { e.preventDefault(); vol.value = Math.max(0, +vol.value - 5); vol.oninput(); }
    else if (/^(Digit|Numpad)[0-6]$/.test(e.code)) setPreset(+e.code.slice(-1));
  });
  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play', toggle); navigator.mediaSession.setActionHandler('pause', toggle);
    navigator.mediaSession.setActionHandler('nexttrack', () => $('next').click()); navigator.mediaSession.setActionHandler('previoustrack', () => $('prev').click());
  }

  /* ================= ビジュアライザ(積みブロック) ================= */
  const cv = $('vis'), cx = cv.getContext('2d');
  function draw() {
    requestAnimationFrame(draw);
    const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = w * dpr; cv.height = h * dpr; }
    cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, w, h);
    analyser.getByteFrequencyData(data);
    const cs = getComputedStyle(document.documentElement), grass = cs.getPropertyValue('--grass'), dirt = cs.getPropertyValue('--dirt');
    const n = Math.max(10, Math.floor(w / 26)), gap = 4, bw = (w - gap * (n - 1)) / n, rows = Math.max(2, Math.floor((h + gap) / (bw + gap)));
    for (let i = 0; i < n; i++) {
      const v = data[Math.floor(i / n * data.length * .8)] / 255, act = Math.max(1, Math.round(v * rows));
      for (let r = 0; r < act; r++) {
        const top = r === act - 1; cx.fillStyle = top ? grass : dirt; cx.globalAlpha = top ? 1 : .5 + .3 * (1 - r / rows);
        cx.fillRect(i * (bw + gap), h - (r + 1) * bw - r * gap, bw, bw);
      }
    }
    cx.globalAlpha = 1;
  }
})();
</script>
</body>
